<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carta: guía del equipo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Spectral:wght@500;700&display=swap">
<style>
:root{--bg:#eceeef;--card:#fff;--ink:#181c20;--mut:#5c656d;--line:#d3d8dc;--chip:#e2e6e9;--tile:#1f2022;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--card:#20242a;--ink:#eceae4;--mut:#9aa3ab;--line:#333a42;--chip:#2c323a}}
:root[data-theme="dark"]{--bg:#15181b;--card:#20242a;--ink:#eceae4;--mut:#9aa3ab;--line:#333a42;--chip:#2c323a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Spectral,Georgia,serif;margin:0}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}
h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.1}
header p{margin:6px 0 0;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
.bar>div{max-width:1100px;margin:auto}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{flex:none;border:0;background:var(--chip);color:var(--ink);font:600 .95rem Figtree,sans-serif;padding:9px 14px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.tools input{flex:1 1 180px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;width:100%}
.chips button{flex:none;font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #3b82f6;outline-offset:2px}
main{max-width:1100px;margin:auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.top{all:unset;display:block;width:100%;cursor:pointer}
.ph{background:var(--tile);border-bottom:5px solid var(--ac)}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.tx{padding:12px 14px 14px}
.name{font-size:1.3rem;line-height:1.2}
.desc{margin:4px 0 10px;color:var(--mut);font-size:.9rem}
.sch{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:6px;padding:3px 9px;font-size:.85rem;font-weight:600}
.sch i{width:11px;height:11px;border-radius:50%;flex:none}
.sch.none{font-weight:400;color:var(--mut)}
.dt{padding:0 14px 16px}
h4{margin:14px 0 4px;font:600 1rem Figtree,sans-serif;color:var(--mut)}
.il{list-style:none;margin:0;padding:0}
.il li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted var(--line)}
.il em{font-style:normal;font-weight:600;white-space:nowrap}
a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.nt{margin:12px 0 0;color:var(--mut);font-size:.92rem}
.card.open{grid-column:1/-1}
@media(min-width:680px){.card.open{display:grid;grid-template-columns:300px 1fr}.card.open .dt{padding-top:12px}}
main h2{font-size:1.4rem;margin:26px 0 10px}
main h2:first-child{margin-top:0}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";margin-left:auto;font-weight:600;font-size:1.2rem}
details[open] summary::after{content:"–"}
.bn{font-family:Spectral,Georgia,serif;font-weight:700;font-size:1.1rem}
.yl{color:var(--mut);font-size:.88rem}
.bd{padding:0 14px 14px;max-width:70ch}
.bd p{margin:4px 0}
.empty{color:var(--mut)}
.evt{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:16px;font-size:.92rem;color:var(--mut)}
.evt b{color:var(--ink)}
.mrow{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dotted var(--line)}
.mrow em{font-style:normal;font-weight:600;white-space:nowrap}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:2px 8px;font-size:.78rem;font-weight:600;margin-left:8px}
</style></head><body>

<script>
const D=JSON.parse(document.getElementById('d').textContent);
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const SAUCES=['Todos','Teriyaki','Maracuyá','Mouse de Palta','Sin salsa'];
let S={tab:'rolls',f:'Todos',q:'',open:null};

const ings=a=>a.length?`<ul class="il">${a.map(x=>`<li><span>${x.id?`<a href="#" data-b="${x.id}" title="Ver receta">${E(x.n)}</a>`:E(x.n)}</span><em>${E(x.q)}</em></li>`).join('')}</ul>`:'';
function card(r,i){const o=S.open==='r'+i;
return `<article class="card${o?' open':''}" id="r${i}" style="--ac:${r.ac}"><button class="top" data-r="${i}" aria-expanded="${o}"><div class="ph"><img src="${r.img}" alt="Pieza del roll ${E(r.name)}"></div><div class="tx"><h3 class="name">${E(r.name)}</h3><p class="desc">${E(r.desc)}</p>${chip(r.sauce,1)}</div></button>${o?`<div class="dt">${r.groups.map(g=>`<h4>${g.t}</h4>${ings(g.items)}`).join('')}${r.note?`<p class="nt">${E(r.note)}</p>`:''}<p class="nt">Cantidades por roll. Tocá un ingrediente subrayado para ver su receta.</p></div>`:''}</article>`}
function blk(b){return `<details id="${b.id}"${S.open===b.id?' open':''}><summary><span class="bn">${E(b.name)}</span>${b.y?`<span class="yl">${E(b.y)}</span>`:''}${chip(b.sauce)}</summary><div class="bd">${ings(b.ing)}${b.p?`<h4>Preparación</h4><p>${E(b.p)}</p>`:''}${b.note?`<p class="nt"><b>${b.nl}:</b> ${E(b.note)}</p>`:''}${b.used.length?`<p class="nt"><b>Se usa en:</b> ${b.used.map(E).join(', ')}</p>`:''}</div></details>`}
const g1=x=>Number(x).toLocaleString('es-AR',{maximumFractionDigits:1});
function miseRows(rows){return rows.length?`<ul class="il">${rows.map(x=>`<li><span>${E(x.n)}</span><em>${g1(x.q)} g</em></li>`).join('')}</ul>`:''}
function miseItem(m,i){const id='m-'+i;
 const tag=m.unit_mode?`${g1(m.units_round)} u. a preparar`:(m.factor!=null?`${g1(m.factor)} tanda(s)`:`${g1(m.demanda)} g`);
 return `<details id="${id}"${S.open===id?' open':''}><summary><span class="bn">${E(m.name)}</span><span class="tag">${tag}</span></summary><div class="bd">
 ${m.demanda!=null?`<p class="nt">Demanda del evento: <b>${g1(m.demanda)} g</b>${m.unit_mode?` (≈ ${g1(m.units_exact)} u. de la unidad habitual; se redondea a ${m.units_round}).`:'.'}</p>`:''}
 <h4>Cantidades a preparar</h4>${miseRows(m.rows)}
 ${m.note?`<p class="nt">${E(m.note)}</p>`:''}
 ${m.used.length?`<p class="nt"><b>Se usa en:</b> ${m.used.map(E).join(', ')}</p>`:''}
 </div></details>`}
function miseView(){
 const ev=D.evento;
 let h=`<div class="evt">Evento <b>${E(ev.nombre)}</b> · ${E(ev.fecha)} · <b>${ev.comensales}</b> comensales · ${ev.piezas_pp} piezas de sushi por persona (mínimo) · ${Math.round(ev.buffer*100)}% de margen por repetición. Las cantidades de abajo ya incluyen ese margen, y además un <b>${Math.round(ev.loss*100)}% extra por pérdida de producción</b> (corte, armado, descarte) sobre la porción que corresponde a rolls — los ingredientes que también se usan en entradas o principales no llevan ese extra en esa porción. Está pensado para armarse antes del servicio.</div>`;
 D.mcats.forEach(c=>{const L=D.mise.filter(m=>m.cat===c&&hit(0,m.name+' '+m.rows.map(x=>x.n).join(' ')));
  if(L.length)h+=`<h2>${c}</h2>`+L.map((m)=>miseItem(m,D.mise.indexOf(m))).join('')});
 return h;
}
const hit=(b,t)=>!S.q||N(t).includes(N(S.q));
function render(){
 document.querySelector('.tabs').innerHTML=TABS.map(([k,l])=>`<button role="tab" data-t="${k}" aria-selected="${S.tab===k}">${l}</button>`).join('');

 document.querySelector('.chips').hidden=!R;
 document.querySelector('.chips').innerHTML=SAUCES.map(f=>`<button data-f="${f}" aria-pressed="${S.f===f}">${f}</button>`).join('');

 if(R){const L=D.rolls.map((r,i)=>[r,i]).filter(([r])=>(S.f==='Todos'||(S.f==='Sin salsa'?!r.sauce:r.sauce&&r.sauce.n===S.f))&&hit(0,r.name+' '+r.desc+' '+r.groups.map(g=>g.items.map(x=>x.n).join(' ')).join(' ')));
  h=L.length?`<div class="grid">${L.map(([r,i])=>card(r,i)).join('')}</div>`:'<p class="empty">Ningún roll coincide con la búsqueda.</p>'}
 else if(S.tab==='bases'){D.cats.forEach(c=>{const L=D.bases.filter(b=>b.cat===c&&hit(0,b.name+' '+b.ing.map(x=>x.n).join(' ')));if(L.length)h+=`<h2>${c}</h2>`+L.map(blk).join('')})}
 else if(S.tab==='mise'){h=miseView()}
 else h=D[S.tab].filter(b=>hit(0,b.name+' '+b.ing.map(x=>x.n).join(' '))).map(blk).join('');
 document.getElementById('v').innerHTML=h||'<p class="empty">Sin resultados.</p>';
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-t],[data-r],[data-b],[data-f]');if(!t)return;
 if(t.dataset.t){S.tab=t.dataset.t;S.open=null;S.f='Todos'}
 else if(t.dataset.f)S.f=t.dataset.f;
 else if(t.dataset.r){const k='r'+t.dataset.r;S.open=S.open===k?null:k;render();if(S.open)document.getElementById(k).scrollIntoView();return}
 else if(t.dataset.b){e.preventDefault();S.tab='bases';S.q='';document.getElementById('q').value='';S.open=t.dataset.b;render();document.getElementById(S.open).scrollIntoView();return}
 render()});
document.getElementById('q').addEventListener('input',e=>{S.q=e.target.value;render()});
render();
